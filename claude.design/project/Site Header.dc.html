<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="background:#17120F;color:rgba(251,247,244,.78)">
    <div style="max-width:1280px;margin:0 auto;padding:8px clamp(14px,4vw,44px);display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase">
      <span style="display:flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:50%;background:#E8442A;display:block;animation:hk-pulse 2s infinite"></span>Free delivery on your first three orders</span>
      <span data-hide-sm="1">Nairobi · 07:00 – 23:00 daily · 0790 000 442</span>
    </div>
  </div>
  <header style="position:sticky;top:0;z-index:70;background:rgba(251,247,244,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(23,18,15,.1)">
    <div style="max-width:1280px;margin:0 auto;padding:11px clamp(14px,4vw,44px);display:flex;align-items:center;gap:clamp(10px,3vw,36px)">
      <a href="Harraka Site.dc.html" style="display:flex;align-items:center;gap:9px;color:#17120F;flex:none">
        <span style="width:26px;height:26px;border-radius:7px;background:#E8442A;display:block"></span>
        <span style="font-size:19px;font-weight:700;letter-spacing:-.03em">harraka</span>
      </a>
      <nav data-nav-desktop="1" style="display:flex;gap:clamp(13px,2vw,26px);flex:1;flex-wrap:wrap;font-size:13.5px;font-weight:500">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="color:{{ n.color }};border-bottom:1.5px solid {{ n.line }};padding-bottom:2px" style-hover="color:#17120F">{{ n.label }}</a>
        </sc-for>
      </nav>
      <span style="flex:1" data-spacer-sm="1"></span>
      <sc-if value="{{ hasCart }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onCart }}" style="flex:none;display:flex;align-items:center;gap:8px;border:1px solid rgba(23,18,15,.16);background:transparent;border-radius:999px;padding:9px 14px;min-height:44px;font:500 13px Archivo,sans-serif;color:#17120F;cursor:pointer" style-hover="border-color:#17120F">
          Basket
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:#E8442A;color:#fff;border-radius:999px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px">{{ cartCount }}</span>
        </button>
      </sc-if>
      <sc-if value="{{ noCart }}" hint-placeholder-val="{{ true }}">
        <a href="Harraka Shop.dc.html" style="flex:none;display:inline-flex;align-items:center;border:1px solid rgba(23,18,15,.16);border-radius:999px;padding:0 15px;min-height:44px;font-size:13px;font-weight:500;color:#17120F" style-hover="border-color:#17120F">Basket</a>
      </sc-if>
      <a href="Harraka Site.dc.html#download" data-hide-sm="1" style="flex:none;display:inline-flex;align-items:center;background:#17120F;color:#FBF7F4;border-radius:999px;padding:0 18px;min-height:44px;font-size:13.5px;font-weight:600" style-hover="background:#E8442A">Get the app</a>
      <button data-nav-toggle="1" onClick="{{ toggleNav }}" style="display:none;flex:none;width:44px;height:44px;align-items:center;justify-content:center;border:1px solid rgba(23,18,15,.16);border-radius:12px;background:transparent;cursor:pointer;flex-direction:column;gap:4px" style-hover="border-color:#17120F">
        <span style="width:17px;height:1.6px;background:#17120F;display:block;transform:{{ barTop }};transition:transform .3s cubic-bezier(.2,.7,.2,1)"></span>
        <span style="width:17px;height:1.6px;background:#17120F;display:block;opacity:{{ barMid }};transition:opacity .2s"></span>
        <span style="width:17px;height:1.6px;background:#17120F;display:block;transform:{{ barBot }};transition:transform .3s cubic-bezier(.2,.7,.2,1)"></span>
      </button>
    </div>
    <div style="display:{{ panelDisp }};border-top:1px solid rgba(23,18,15,.1);background:#FBF7F4">
      <div style="max-width:1280px;margin:0 auto;padding:8px clamp(14px,4vw,44px) 16px;display:flex;flex-direction:column">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" onClick="{{ closeNav }}" style="display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid rgba(23,18,15,.09);font-size:16px;font-weight:600;letter-spacing:-.02em;color:{{ n.colorM }}">
            <span>{{ n.label }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#E8442A">→</span>
          </a>
        </sc-for>
        <a href="Harraka Site.dc.html#download" onClick="{{ closeNav }}" style="margin-top:14px;display:flex;align-items:center;justify-content:center;background:#17120F;color:#FBF7F4;border-radius:999px;min-height:48px;font-size:15px;font-weight:600">Get the app</a>
        <div style="margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:rgba(23,18,15,.5);text-align:center">0790 000 442 · 07:00 – 23:00 daily</div>
      </div>
    </div>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;shop&quot;,&quot;about&quot;,&quot;coverage&quot;,&quot;numbers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onCart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const NAV = [
  { label: "Home", href: "Harraka Site.dc.html", key: "home" },
  { label: "Shop", href: "Harraka Shop.dc.html", key: "shop" },
  { label: "About", href: "Harraka About.dc.html", key: "about" },
  { label: "Coverage", href: "Harraka Site.dc.html#coverage", key: "coverage" },
  { label: "Investors", href: "Harraka Site.dc.html#numbers", key: "numbers" },
  { label: "Contact", href: "Harraka Contact.dc.html", key: "contact" }
];

class Component extends DCLogic {
  state = { open: false };

  renderVals() {
    const active = this.props.active || "home";
    const cart = this.props.onCart;
    const o = this.state.open;
    return {
      nav: NAV.map(n => ({
        label: n.label,
        href: n.href,
        color: n.key === active ? "#17120F" : "rgba(23,18,15,.62)",
        colorM: n.key === active ? "#B8301A" : "#17120F",
        line: n.key === active ? "#E8442A" : "transparent"
      })),
      hasCart: !!cart,
      noCart: !cart,
      onCart: cart,
      cartCount: this.props.cartCount ?? 0,
      toggleNav: () => this.setState({ open: !o }),
      closeNav: () => this.setState({ open: false }),
      panelDisp: o ? "block" : "none",
      barTop: o ? "translateY(5.6px) rotate(45deg)" : "none",
      barBot: o ? "translateY(-5.6px) rotate(-45deg)" : "none",
      barMid: o ? 0 : 1
    };
  }
}

</script>
</body>
</html>
