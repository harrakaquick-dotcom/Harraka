<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Harraka grocery bag">
  <!-- Fallback shown by <Img> while an image loads or when it fails: a Harraka
       grocery bag (H mark from the app icon) packed with groceries, on the
       delivery-radius rings. Colours are the brand tokens in src/tailwind.css. -->
  <rect width="400" height="300" fill="#fdede9" />

  <!-- Delivery radius rings -->
  <g fill="none" stroke="#e8442a">
    <circle cx="200" cy="170" r="140" stroke-opacity="0.12" stroke-width="1.5" />
    <circle cx="200" cy="170" r="100" stroke-opacity="0.18" stroke-width="1.5" />
  </g>

  <!-- Speed lines: ten-minute delivery -->
  <g stroke="#e8442a" stroke-linecap="round" stroke-width="5">
    <path d="M86 160 H126" stroke-opacity="0.9" />
    <path d="M70 184 H124" stroke-opacity="0.55" />
    <path d="M94 208 H128" stroke-opacity="0.3" />
  </g>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="243" rx="68" ry="7" fill="#17120f" fill-opacity="0.1" />

  <!-- Groceries peeking out of the bag -->
  <g>
    <!-- Baguette -->
    <rect x="206" y="64" width="22" height="92" rx="11" fill="#e0a55c" transform="rotate(18 217 110)" />
    <path d="M214 78 l10 -4 M211 94 l10 -4 M208 110 l10 -4" stroke="#b97a35" stroke-width="3" stroke-linecap="round" transform="rotate(18 217 110)" />
    <!-- Milk carton -->
    <path d="M160 96 h32 v60 h-32 z" fill="#ffffff" stroke="#17120f" stroke-opacity="0.18" stroke-width="2" />
    <path d="M160 96 l8 -14 h16 l8 14 z" fill="#ffffff" stroke="#17120f" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round" />
    <rect x="160" y="112" width="32" height="10" fill="#e8442a" />
    <!-- Greens -->
    <path d="M150 124 C140 100 146 86 158 80 C162 96 162 110 156 126 Z" fill="#1faa59" />
    <path d="M150 128 C128 114 124 100 128 88 C142 96 152 108 156 126 Z" fill="#0f7a3c" />
    <!-- Orange -->
    <circle cx="238" cy="120" r="15" fill="#f2a33a" />
    <path d="M232 106 l6 5 l6 -5" fill="none" stroke="#1faa59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bag -->
  <path d="M140 128 H260 L254 234 Q253 242 245 242 H155 Q147 242 146 234 Z" fill="#e8442a" />
  <path d="M140 128 H260 L259 142 H141 Z" fill="#b8301a" />
  <!-- H mark from the app icon, scaled onto the bag -->
  <g transform="translate(179 162) scale(0.11) translate(-320 -280)">
    <path d="M320 280 H449 V464 H576 V280 H705 V745 H576 V553 H449 V745 H320 Z" fill="#ffffff" />
    <path d="M705 280 H821 L705 396 Z" fill="#b8301a" />
  </g>
</svg>
